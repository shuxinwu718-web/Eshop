server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/eshops?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

logging:
  level:
    com.shopsphere: info # 生产口径；压测验证时临时调整为 info（debug 会导致每请求 19+ 行 SQL/WARN 日志，console 同步锁成为瓶颈）