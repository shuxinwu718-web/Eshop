spring:
  file:
    upload-dir: ./uploads
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
  data:
    elasticsearch:
      repositories:
        enabled: ${elasticsearch.enabled:false}   # ES repository 由 elasticsearch.enabled 开关控制（关键：避免启动时连 ES 建索引）
  mail:                                   # 👈 新增邮件配置
    host: smtp.qq.com
    port: 587
    username: 2368151277@qq.com       # 替换为你的QQ邮箱
    password: ${MAIL_PASSWORD:yfxkuhmtayfpdhjh}    # 授权码，生产环境请通过环境变量 MAIL_PASSWORD 注入
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
