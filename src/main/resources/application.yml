  data:
    elasticsearch:
      repositories:
        enabled: ${elasticsearch.enabled:true}
  mail:
    host: smtp.qq.com
    port: 587
    username: 2368151277@qq.com
    password: ${MAIL_PASSWORD:yfxkuhmtayfpdhjh}
    default-encoding: UTF-8
