# JWT 配置
jwt:
  # 生产环境请通过环境变量 JWT_SECRET 注入更安全的密钥
  secret: ${JWT_SECRET:e-commerce-secret-key-2026-128bit-long-string-that-is-at-least-64-characters-long-and-very-secure-please-change-it}
  expiration: 14400000

# ========== Elasticsearch 开关 ==========
# 无 ES 环境默认 false（走 MySQL 降级搜索）；有 ES 环境改为 true 并配置 spring.elasticsearch.uris
elasticsearch:
  enabled: ${ES_ENABLED:false}

management:
  health:
    elasticsearch:
      enabled: ${elasticsearch.enabled:false}


# 新人礼包
shop:
  newbie:
    coupon-ids: 5,5,5,6,6   # 请替换为实际的优惠券ID（3张满减券 + 2张折扣券）

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true

# Swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.springframework.security: DEBUG
    com.shopsphere: DEBUG