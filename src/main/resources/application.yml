spring:
  file:
    upload-dir: ./uploads
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
  data:
    elasticsearch:
      repositories:
        enabled: ${elasticsearch.enabled:true}
  mail:
    host: smtp.qq.com
    port: 587
    username: 2368151277@qq.com
    password: ${MAIL_PASSWORD:yfxkuhmtayfpdhjh}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    dynamic: true
  # 👇 amqp 和 rabbitmq 是平级的，都在 spring 下
  amqp:
    deserialization:
      trust:
        all: true
# JWT 配置
jwt:
  # 生产环境请通过环境变量 JWT_SECRET 注入更安全的密钥
  secret: ${JWT_SECRET:e-commerce-secret-key-2026-128bit-long-string-that-is-at-least-64-characters-long-and-very-secure-please-change-it}
  expiration: 14400000

# ========== Elasticsearch 开关 ==========
# 直接改下面这行 true/false 即可切换：
#   true  = 启用 ES 搜索（需 ES 可达，地址见上方 spring.elasticsearch.uris）
#   false = 禁用 ES，走 MySQL 降级搜索（适合无 ES 环境）
elasticsearch:
  enabled: false

management:
  health:
    elasticsearch:
      enabled: ${elasticsearch.enabled:false}


# 新人礼包
shop:
  newbie:
    coupon-ids: 5,5,5,6,6   # 请替换为实际的优惠券ID（3张满减券 + 2张折扣券）

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true

# Swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.springframework.security: DEBUG
    com.shopsphere: DEBUG