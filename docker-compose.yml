services:

  mysql:
    image: mysql:8.0
    container_name: eshop-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: eshops
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      # 仅挂载完整快照（39 张表，由本地开发库导出）
      # 增量脚本（V*.sql）已合并进快照，无需单独执行
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eshop-net

  redis:
    image: redis:7-alpine
    container_name: eshop-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eshop-net

  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: eshop-es
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - eshop-net

  app:
    build: .
    container_name: eshop-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - TZ=Asia/Shanghai
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_started
    networks:
      - eshop-net

  frontend:
    # 前端项目与后端仓库同级：../Eshop
    build:
      context: ../Eshop
    container_name: eshop-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - app
    networks:
      - eshop-net

volumes:
  mysql-data:
  es-data:
  uploads-data:

networks:
  eshop-net:
    driver: bridge
